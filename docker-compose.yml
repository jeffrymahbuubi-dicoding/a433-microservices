# Menggunakan Docker Compose file format versi 3.7 (versi 2 atau lebih)
version: "3.7"

# Daftar service (container) yang membentuk aplikasi
services:
  # Service item-app: aplikasi web Node.js + Express
  item-app:
    # Memakai image item-app dari GitHub Packages
    image: ghcr.io/jeffrymahbuubi-dicoding/item-app:v1
    # Port mapping: port 80 di host diteruskan ke port 8080 di container
    ports:
      - "80:8080"
    # item-app hanya dijalankan setelah item-db diluncurkan
    depends_on:
      - item-db
    # Restart policy: container selalu di-restart ketika terhenti
    restart: always

  # Service item-db: database MongoDB
  item-db:
    # Memakai image mongo versi 3 dari Docker Hub
    image: mongo:3
    # Memakai volume bernama app-db yang di-mount ke /data/db (lokasi data MongoDB) di container
    volumes:
      - app-db:/data/db
    # Restart policy: container selalu di-restart ketika terhenti
    restart: always

# Daftar volume yang digunakan
volumes:
  # Volume app-db untuk menyimpan data MongoDB secara persisten
  app-db:
