# Secret untuk kredensial MongoDB (data sensitif). Nilai di bagian data wajib dalam format base64.
apiVersion: v1                      # versi API untuk object Secret
kind: Secret                        # jenis object: Secret
metadata:
  name: mongo-secret                # nama Secret, dirujuk oleh StatefulSet (sebagai volume) dan Deployment backend (env)
  labels:
    app: mongo
type: Opaque                        # tipe Secret umum (pasangan key-value bebas)
data:
  MONGO_ROOT_USERNAME: YWRtaW4=                      # "admin" dalam base64 (echo -n admin | base64)
  MONGO_ROOT_PASSWORD: c3VwZXJzZWNyZXRwYXNzd29yZA==  # "supersecretpassword" dalam base64 (nilai contoh dari instruksi submission) gitleaks:allow
