# Secret untuk kredensial RabbitMQ (data sensitif). Nilai di bagian data wajib dalam format base64 (lesson 7.10).
# Dibaca oleh StatefulSet rabbitmq (membuat user awal) dan oleh order-service serta shipping-service (menyusun AMQP_URL).
# Catatan: base64 hanya penyandian, bukan enkripsi. Nilai di bawah adalah nilai contoh untuk Cluster lokal.
apiVersion: v1                      # versi API untuk object Secret
kind: Secret                        # jenis object: Secret
metadata:
  name: rabbitmq-secret             # nama Secret, dirujuk oleh secretKeyRef di tiga manifest lain
  namespace: ecommerce              # Namespace tempat Secret dibuat
  labels:
    app: rabbitmq                   # label pengelompokan
type: Opaque                        # tipe Secret umum (pasangan key-value bebas)
data:
  RABBITMQ_DEFAULT_USER: ZWNvbW1lcmNl                 # "ecommerce" dalam base64 (echo -n ecommerce | base64); nama variabel yang dibaca image rabbitmq
  RABBITMQ_DEFAULT_PASS: ZWNvbW1lcmNlZGVtbzEyMw==     # "ecommercedemo123" dalam base64; password contoh untuk Cluster lokal, bukan kredensial nyata # gitleaks:allow
